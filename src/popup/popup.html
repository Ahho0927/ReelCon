<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reel Controls</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="5" y="5" width="14" height="14" rx="4" stroke="currentColor" stroke-width="1.75" />
              <path d="M10 9.25 15.1 12 10 14.75v-5.5Z" fill="currentColor" />
            </svg>
          </span>
          <h1>Reel Controls</h1>
        </div>
        <label class="switch switch-master" aria-label="Enable Reel Controls" data-i18n-aria-label="masterLabel">
          <input id="enabled" type="checkbox" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </header>

      <div class="divider"></div>

      <section class="settings-list" aria-label="Gesture settings" data-i18n-aria-label="gestureSettings">
        <div class="setting-row">
          <div class="setting-copy">
            <strong data-i18n="centerHoldTitle">Center hold</strong>
            <span data-i18n="centerHoldDescription">Hide the interface and pause</span>
          </div>
          <label class="switch" aria-label="Enable center hold" data-i18n-aria-label="centerHoldLabel">
            <input id="centerHoldEnabled" type="checkbox" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-copy">
            <strong data-i18n="edgeHoldTitle">Edge hold</strong>
            <span data-i18n="edgeHoldDescription">Play at 2× while holding</span>
          </div>
          <label class="switch" aria-label="Enable edge hold" data-i18n-aria-label="edgeHoldLabel">
            <input id="edgeHoldEnabled" type="checkbox" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="setting-row" id="speedLockRow">
          <div class="setting-copy">
            <strong data-i18n="speedLockTitle">Slide down to lock</strong>
            <span data-i18n="speedLockDescription">Repeat the gesture to unlock</span>
          </div>
          <label class="switch" aria-label="Enable 2× speed lock" data-i18n-aria-label="speedLockLabel">
            <input id="speedLockEnabled" type="checkbox" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-copy">
            <strong data-i18n="scrubBarTitle">Seek bar</strong>
            <span data-i18n="scrubBarDescription">Drag to seek</span>
          </div>
          <label class="switch" aria-label="Enable seek bar" data-i18n-aria-label="scrubBarLabel">
            <input id="scrubBarEnabled" type="checkbox" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
      </section>

      <footer class="scope-note">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5.5" y="10" width="13" height="10" rx="2.4" stroke="currentColor" stroke-width="1.6" />
          <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span data-i18n="scopeNote">Works only on Instagram videos</span>
      </footer>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
